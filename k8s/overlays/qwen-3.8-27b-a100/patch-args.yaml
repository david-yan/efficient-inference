apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  labels:
    app: vllm-server-qwen-3-8-27b-a100
spec:
  selector:
    matchLabels:
      app: vllm-server-qwen-3-8-27b-a100
  template:
    metadata:
      labels:
        app: vllm-server-qwen-3-8-27b-a100
    spec:
      enableServiceLinks: false
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-a100-80gb
      containers:
      - name: vllm
        args:
        - "--host=0.0.0.0"
        - "--port=8000"
        - "--model=Qwen/Qwen3.8-27B"
        - "--served-model-name=qwen-3.8-27b"
        - "--tensor-parallel-size=1"
        - "--max-model-len=32768"
        - "--gpu-memory-utilization=0.92"
        - "--dtype=bfloat16"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=qwen3_coder"
        - "--chat-template=/vllm-workspace/examples/tool_chat_template_qwen3coder.jinja"
        env:
        - name: HF_HOME
          value: "/mnt/gcs/hf_cache"
        resources:
          limits:
            nvidia.com/gpu: "1"
            cpu: "12000m"
            memory: "48Gi"
          requests:
            nvidia.com/gpu: "1"
            cpu: "8000m"
            memory: "32Gi"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 90
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
spec:
  selector:
    app: vllm-server-qwen-3-8-27b-a100
