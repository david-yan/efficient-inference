apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  template:
    spec:
      containers:
      - name: vllm
        args:
        - "--model=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
        - "--served-model-name=deepseek-r1-7b"
        - "--tensor-parallel-size=1"
        - "--max-model-len=32768"
        - "--gpu-memory-utilization=0.90"
        - "--dtype=bfloat16"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=deepseek_v3"
        - "--chat-template=/vllm-workspace/examples/tool_chat_template_deepseekr1.jinja"
