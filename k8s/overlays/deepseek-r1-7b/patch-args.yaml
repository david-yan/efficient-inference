apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  template:
    spec:
      containers:
      - name: vllm
        args:
        - "--model=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
        - "--served-model-name=deepseek-r1-7b"
        - "--tensor-parallel-size=1"
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
        - "--dtype=bfloat16"
