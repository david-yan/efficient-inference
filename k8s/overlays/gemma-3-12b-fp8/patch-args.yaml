apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  template:
    spec:
      containers:
      - name: vllm
        args:
        - "--model=google/gemma-3-12b-it"
        - "--served-model-name=gemma-3-12b-fp8"
        - "--trust-remote-code"
        - "--quantization=fp8"
        - "--tensor-parallel-size=1"
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.92"
        - "--dtype=bfloat16"
