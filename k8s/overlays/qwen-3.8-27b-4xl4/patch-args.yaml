apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      containers:
      - name: vllm
        args:
        - "--model=Qwen/Qwen3.8-27B"
        - "--served-model-name=qwen-3.8-27b"
        - "--tensor-parallel-size=4"
        - "--max-model-len=32768"
        - "--gpu-memory-utilization=0.92"
        - "--dtype=bfloat16"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=qwen3_coder"
        - "--chat-template=/vllm-workspace/examples/tool_chat_template_qwen3coder.jinja"

        env:
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "spawn"
        - name: HF_HOME
          value: "/mnt/gcs/hf_cache"
        resources:
          limits:
            nvidia.com/gpu: "4"
            cpu: "16000m"
            memory: "64Gi"
          requests:
            nvidia.com/gpu: "4"
            cpu: "8000m"
            memory: "32Gi"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 30
