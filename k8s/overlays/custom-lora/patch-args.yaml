apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  template:
    spec:
      containers:
      - name: vllm
        args:
        - "--model=Qwen/Qwen2.5-7B-Instruct"
        - "--served-model-name=qwen-custom-dpo"
        - "--enable-lora"
        - "--lora-modules"
        - "dpo_adapter=/mnt/gcs/adapters/qwen-7b-dpo-v1"
        - "--max-model-len=32768"
        - "--gpu-memory-utilization=0.90"
        - "--dtype=bfloat16"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=qwen3_coder"
        - "--chat-template=/vllm-workspace/examples/tool_chat_template_qwen3coder.jinja"
